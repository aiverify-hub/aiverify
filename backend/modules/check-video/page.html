<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Video (test)</title>
<style>
  :root { --bg:#f7f7f4; --card:#ffffff; --ink:#1d1d1b; --muted:#5b5b57; --line:#d9d8d2; --accent:#1f5fa8;
          --ok:#1d6b35; --ok-bg:#e5f3e8; --bad:#a3271f; --bad-bg:#fbe7e5; --mid:#7a5a00; --mid-bg:#fbf1d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#21211f; --ink:#ecebe6; --muted:#a8a7a0; --line:#3a3a36; --accent:#7fb0ea;
          --ok:#8fd6a2; --ok-bg:#1d3324; --bad:#f2a199; --bad-bg:#3d1f1c; --mid:#e9cc7a; --mid-bg:#3a3120; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 26px; margin: 4px 0 2px; } .sub { color:var(--muted); margin:0 0 18px; }
  nav button { font-size:17px; padding:8px 14px; margin-right:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; cursor:pointer; }
  nav button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:14px 0; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input[type=url], textarea { width:100%; font-size:18px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  textarea { min-height:90px; }
  .go { font-size:19px; font-weight:600; padding:11px 20px; margin-top:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  .go[disabled] { opacity:.6; cursor:wait; }
  details summary { cursor:pointer; color:var(--muted); margin-top:10px; }
  .status { color:var(--muted); margin-top:10px; min-height:1.5em; }
  .verdict { display:inline-block; font-weight:700; padding:2px 10px; border-radius:6px; }
  .v-supported { background:var(--ok-bg); color:var(--ok); } .v-contradicted, .v-misleading { background:var(--bad-bg); color:var(--bad); } .v-insufficient { background:var(--mid-bg); color:var(--mid); }
  .claim { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
  .claim h3 { font-size:19px; margin:4px 0 6px; }
  blockquote { margin:8px 0; padding:6px 12px; border-left:4px solid var(--line); color:var(--ink); }
  .small { font-size:15px; color:var(--muted); }
  ul.src { padding-left:20px; margin:6px 0; } ul.src li { margin:3px 0; overflow-wrap:anywhere; }
  a { color:var(--accent); }
  .limits { background:var(--mid-bg); color:var(--ink); border-radius:8px; padding:10px 12px; margin-top:12px; }
  .q { font-weight:700; font-size:19px; margin:14px 0 8px; }
  .answers button { font-size:18px; padding:9px 16px; margin:4px 6px 4px 0; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); cursor:pointer; }
  .answers button[aria-pressed="true"] { border-color:var(--accent); background:var(--accent); color:#fff; }
  .saved { color:var(--ok); font-weight:600; margin-left:6px; }
</style>
</head>
<body>
<main>
  <h1>Check Video <span class="small">(local test, not public)</span></h1>
  <p class="sub">Paste a YouTube link. AIVerify reads the captions, picks the main factual claims, and checks each one against sources.</p>
  <nav><button id="tabCheck" aria-pressed="true">Check a video</button><button id="tabReview" aria-pressed="false">Review answers</button></nav>

  <section id="check">
    <div class="card">
      <label for="url">YouTube link</label>
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
      <details><summary>Captions not available? Paste the transcript instead (optional)</summary>
        <label for="tx" style="margin-top:8px">Transcript text</label><textarea id="tx"></textarea></details>
      <button class="go" id="go">Check Video</button>
      <div class="status" id="status" role="status"></div>
    </div>
    <div id="result"></div>
  </section>

  <section id="review" hidden>
    <p class="sub">One question per video. Your answers are saved on this computer only.</p>
    <div id="reviewList"></div>
  </section>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { if (k === 'text') n.textContent = attrs[k]; else if (k === 'cls') n.className = attrs[k]; else n.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function safeLink(url, text) { var ok = /^https?:\/\//i.test(String(url || '')); return ok ? el('a', { href: url, target: '_blank', rel: 'noopener noreferrer', text: text || url }) : el('span', { text: text || '' }); }
  var ROLE_HELP = { 'primary/official': 'official or primary source', 'fact-check': 'fact-checker', 'news/reference': 'news or reference', 'originator of the claim': 'possible origin of the claim', 'other': 'other' };

  function renderResult(r, withReview) {
    var box = el('div', { cls: 'card' });
    if (!r.ok) { box.appendChild(el('p', { text: r.error || 'The check could not be completed.' })); }
    var v = r.video || {};
    if (v.url) box.appendChild(el('p', {}, [el('strong', { text: v.title || 'Video' }), ' ', el('br'), safeLink(v.url)]));
    if (v.captionSource) box.appendChild(el('p', { cls: 'small', text: 'Captions: ' + v.captionSource + (v.captionsTruncated ? ' (long video: only the first part was read)' : '') }));
    if (r.summary) box.appendChild(el('p', { text: r.summary }));
    (r.claims || []).forEach(function (c) {
      var d = el('div', { cls: 'claim' });
      d.appendChild(el('div', { cls: 'small', text: c.central ? 'Main claim' : 'Claim ' + c.n }));
      d.appendChild(el('h3', { text: c.claim }));
      if (c.videoQuote) d.appendChild(el('p', { cls: 'small', text: 'In the video: “' + c.videoQuote + '”' }));
      d.appendChild(el('span', { cls: 'verdict v-' + c.verdict, text: c.label }));
      if (c.reason) d.appendChild(el('p', { text: c.reason }));
      if (c.quote) {
        d.appendChild(el('blockquote', { text: '“' + c.quote.text + '”' }));
        d.appendChild(el('p', { cls: 'small' }, ['Source ' + c.quote.sourceN + ': ', safeLink(c.quote.url, c.quote.publisher), ' (' + (ROLE_HELP[c.quote.role] || c.quote.role) + ')']));
      }
      if (c.sources && c.sources.length) {
        var ul = el('ul', { cls: 'src' });
        c.sources.forEach(function (s) { ul.appendChild(el('li', {}, [s.n + '. ', safeLink(s.url, s.title || s.url), ' — ' + s.publisher + ', ' + (ROLE_HELP[s.role] || s.role)])); });
        d.appendChild(el('details', {}, [el('summary', { text: 'Sources read (' + c.sources.length + ')' }), ul]));
      }
      box.appendChild(d);
    });
    if (r.limits) box.appendChild(el('p', { cls: 'limits', text: r.limits }));
    if (r.ok && (r.claims || []).length) box.appendChild(el('p', { cls: 'small' }, ['Looking for a faith or moral perspective on this topic? This is optional: ', safeLink('https://aiverify.tech/', 'ask on AIVerify’s main page'), ' (KJV-based answers).']));
    if (r.cost) box.appendChild(el('p', { cls: 'small', text: 'Cost of this check: about $' + Number(r.cost.usd || 0).toFixed(3) + (r.timings && r.timings.totalMs ? ' · ' + Math.round(r.timings.totalMs / 1000) + ' seconds' : '') }));
    if (withReview) box.appendChild(reviewBlock(r));
    return box;
  }

  function reviewBlock(r) {
    var wrap = el('div');
    wrap.appendChild(el('p', { cls: 'q', text: 'Are AIVerify’s answers for this video right?' }));
    var answers = el('div', { cls: 'answers' }), note = el('textarea', { placeholder: 'Optional: what was wrong or missing?' }), saved = el('span', { cls: 'saved' });
    var current = r.review && r.review.answer;
    if (r.review && r.review.note) note.value = r.review.note;
    [['right', 'Right'], ['partly', 'Partly right'], ['wrong', 'Wrong'], ['unsure', 'Not sure']].forEach(function (a) {
      var b = el('button', { type: 'button', 'aria-pressed': String(current === a[0]), text: a[1] });
      b.addEventListener('click', function () { save(a[0]); });
      answers.appendChild(b);
    });
    function save(answer) {
      saved.textContent = 'Saving…';
      fetch('/check-video/review', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ runId: r.runId, answer: answer, note: note.value }) })
        .then(function (x) { return x.json(); }).then(function (j) {
          if (!j.ok) { saved.textContent = 'Not saved'; return; }
          Array.prototype.forEach.call(answers.children, function (b) { b.setAttribute('aria-pressed', String(b.textContent === { right: 'Right', partly: 'Partly right', wrong: 'Wrong', unsure: 'Not sure' }[answer])); });
          saved.textContent = 'Saved'; current = answer;
        }).catch(function () { saved.textContent = 'Not saved'; });
    }
    answers.appendChild(saved);
    wrap.appendChild(answers);
    wrap.appendChild(note);
    var saveNote = el('button', { type: 'button', text: 'Save note' });
    saveNote.addEventListener('click', function () { if (current) save(current); else saved.textContent = 'Pick an answer first'; });
    wrap.appendChild(el('div', { cls: 'answers' }, [saveNote]));
    return wrap;
  }

  $('go').addEventListener('click', function () {
    var url = $('url').value.trim(); if (!url) { $('status').textContent = 'Paste a YouTube link first.'; return; }
    $('go').disabled = true; $('result').textContent = '';
    var t0 = Date.now(); $('status').textContent = 'Checking… this usually takes 30 to 90 seconds.';
    var tick = setInterval(function () { $('status').textContent = 'Checking… ' + Math.round((Date.now() - t0) / 1000) + ' seconds so far.'; }, 1000);
    fetch('/check-video/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ url: url, transcript: $('tx').value }) })
      .then(function (x) { return x.json(); })
      .then(function (r) { $('status').textContent = 'Done.'; $('result').appendChild(renderResult(r, false)); })
      .catch(function () { $('status').textContent = 'The check failed. Please try again.'; })
      .then(function () { clearInterval(tick); $('go').disabled = false; });
  });

  function showTab(review) {
    $('check').hidden = review; $('review').hidden = !review;
    $('tabCheck').setAttribute('aria-pressed', String(!review)); $('tabReview').setAttribute('aria-pressed', String(review));
    if (review) loadReview();
  }
  function loadReview() {
    $('reviewList').textContent = 'Loading…';
    fetch('/check-video/runs').then(function (x) { return x.json(); }).then(function (j) {
      $('reviewList').textContent = '';
      var runs = (j.runs || []).filter(function (r) { return r.video && r.video.url; });
      if (!runs.length) { $('reviewList').appendChild(el('p', { text: 'No checks yet.' })); return; }
      var done = runs.filter(function (r) { return r.review; }).length;
      $('reviewList').appendChild(el('p', { cls: 'small', text: done + ' of ' + runs.length + ' videos answered.' }));
      runs.forEach(function (r) { $('reviewList').appendChild(renderResult(r, true)); });
    }).catch(function () { $('reviewList').textContent = 'Could not load the list.'; });
  }
  $('tabCheck').addEventListener('click', function () { showTab(false); });
  $('tabReview').addEventListener('click', function () { showTab(true); });
  if (location.hash === '#review') showTab(true);
})();
</script>
</body>
</html>
